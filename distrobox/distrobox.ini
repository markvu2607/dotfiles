# Distrobox manifests — chia theo vai trò (role-based dev containers)
# Dựng 1 container: just box fe
# Xóa 1 container:  distrobox rm fe

[fe]
image=registry.fedoraproject.org/fedora-toolbox:latest
pull=true
volume="/home/linuxbrew:/home/linuxbrew:ro"
additional_packages="fish gcc gcc-c++ make pkg-config openssl-devel"
init_hooks="usermod -s /usr/bin/fish $(id -nu 1000)"
init_hooks="curl -fsSL https://vite.plus | runuser -u $(id -nu 1000) -- env VP_NODE_MANAGER=yes VP_PM_MANAGER=yes bash && rm -f $HOME/.config/fish/conf.d/vite-plus.fish"
init_hooks="{ test -x $HOME/.cargo/bin/rustup || curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | runuser -u $(id -nu 1000) -- sh -s -- -y --no-modify-path --default-toolchain stable -c rust-analyzer,clippy,rustfmt,rust-src; }"

[cp]
image=registry.fedoraproject.org/fedora-toolbox:latest
pull=true
volume="/home/linuxbrew:/home/linuxbrew:ro"
additional_packages="fish gcc gcc-c++ make pkg-config openssl-devel"
init_hooks="usermod -s /usr/bin/fish $(id -nu 1000)"
init_hooks="{ test -x $HOME/.cargo/bin/rustup || curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | runuser -u $(id -nu 1000) -- sh -s -- -y --no-modify-path --default-toolchain stable -c rust-analyzer,clippy,rustfmt,rust-src; }"
