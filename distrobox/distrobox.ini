# Distrobox manifests — chia theo vai trò (role-based dev containers)
# Dựng 1 container: just box fe
# Xóa 1 container:  distrobox rm fe

[fe]
image=registry.fedoraproject.org/fedora-toolbox:latest
pull=true
volume="/home/linuxbrew:/home/linuxbrew:ro"
additional_packages="fish gcc gcc-c++ make pkg-config openssl-devel rustup"
init_hooks="usermod -s /usr/bin/fish $(id -nu 1000)"
init_hooks="curl -fsSL https://vite.plus | runuser -u $(id -nu 1000) -- env VP_NODE_MANAGER=yes VP_PM_MANAGER=yes bash"
